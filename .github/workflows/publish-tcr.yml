name: Build OKRamp image to TCR

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okramp-publish-tcr
  cancel-in-progress: false

env:
  REGISTRY: ccr.ccs.tencentyun.com
  IMAGE: ccr.ccs.tencentyun.com/${{ vars.TCR_NAMESPACE }}/okramp

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Tencent TCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show deployment image
        run: |
          echo "### Dokploy 部署镜像" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ env.IMAGE }}:sha-${{ github.sha }}' >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
