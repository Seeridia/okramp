name: Build image to Tencent TCR

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-tcr-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.TCR_REGISTRY || 'ccr.ccs.tencentyun.com' }}
  TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
  TCR_REPOSITORY: ${{ vars.TCR_REPOSITORY }}
  IMAGE: ${{ vars.TCR_REGISTRY || 'ccr.ccs.tencentyun.com' }}/${{ vars.TCR_NAMESPACE }}/${{ vars.TCR_REPOSITORY }}
  DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
  DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate repository variables
        shell: bash
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          for variable in TCR_NAMESPACE TCR_REPOSITORY DOKPLOY_URL DOKPLOY_APPLICATION_ID DOKPLOY_API_KEY; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing Actions variable or secret: $variable"
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Tencent TCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and load image
        id: build
        timeout-minutes: 15
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push image to Tencent TCR
        id: push
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          docker push "${IMAGE}:sha-${GITHUB_SHA}" | tee "$RUNNER_TEMP/tcr-push.log"
          digest=$(sed -n 's/.*digest: \(sha256:[a-f0-9]\{64\}\).*/\1/p' "$RUNNER_TEMP/tcr-push.log" | tail -n 1)
          if [[ -z "$digest" ]]; then
            echo "::error::Push completed without a registry digest in the output"
            exit 1
          fi
          docker push "${IMAGE}:latest" | tee "$RUNNER_TEMP/tcr-latest-push.log"
          latest_digest=$(sed -n 's/.*digest: \(sha256:[a-f0-9]\{64\}\).*/\1/p' "$RUNNER_TEMP/tcr-latest-push.log" | tail -n 1)
          if [[ "$latest_digest" != "$digest" ]]; then
            echo "::error::latest and SHA tags must resolve to the same image digest"
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Trigger Dokploy deployment
        timeout-minutes: 2
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          umask 077
          jq -n \
            --arg applicationId "$DOKPLOY_APPLICATION_ID" \
            --arg title "GitHub ${GITHUB_SHA:0:7}" \
            --arg description "Image ${IMAGE}:sha-${GITHUB_SHA}; ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{applicationId: $applicationId, title: $title, description: $description}' \
            > "$RUNNER_TEMP/dokploy-deploy-request.json"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 60 \
            -X POST "${DOKPLOY_URL%/}/api/application.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            --data-binary "@$RUNNER_TEMP/dokploy-deploy-request.json" \
            --output "$RUNNER_TEMP/dokploy-deploy-response.json"
          echo "Dokploy deployment request accepted. Check Deployments for the final result."

      - name: Show deployment image
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "### Dokploy 部署镜像" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy target: ${IMAGE}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}:sha-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Dokploy deployment requested; this confirms submission, not deployment completion." >> "$GITHUB_STEP_SUMMARY"
